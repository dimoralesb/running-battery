[project]
name = "runningbattery"
version = "0.1.0"
description = "Running Battery: hard running from football tracking data, and what it would leave a typical professional"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "pydantic>=2.9",
    "numba>=0.68.0",
]

[project.optional-dependencies]
# Offline calibration against open data (IDSSE). Never needed to run the demo.
calib = ["floodlight>=1.2"]
# Replay as GIF or still frames (python -m runningbattery.sim.replay --gif / --stills). The HTML
# replay needs nothing extra.
replay = ["matplotlib>=3.9"]
agents = [
    "agent-framework-core>=1.22",
    "agent-framework-openai>=1.17",
    "azure-identity>=1.26",
    "mcp>=1.24,<2",
    "openai>=3.30",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
